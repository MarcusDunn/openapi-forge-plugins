[package]
name = "generator-rust-tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAPI Forge generator that emits a tower-based Rust client, one `impl Operation` block per operation."

[lib]
crate-type = ["cdylib"]

[dependencies]
codegen-rust-serde = { path = "../codegen-rust-serde" }
forge-plugin-sdk = { workspace = true, features = ["generator"] }
serde = { workspace = true }
serde_json = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
prettyplease = "0.2"
