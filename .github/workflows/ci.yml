name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Cheap lints. Run first so a bad rustfmt fails the PR in seconds rather
  # than waiting for the wasm build to finish.
  # ---------------------------------------------------------------------------
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Build every plugin in the workspace (debug + release, wasm32-wasip2) and
  # run clippy across the whole tree. Uploads the release `.wasm` artifacts
  # so the downstream test jobs can consume them without rebuilding.
  # ---------------------------------------------------------------------------
  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo build (debug)
        run: cargo build --target wasm32-wasip2
      - name: cargo build (release)
        run: cargo build --release --target wasm32-wasip2
      - name: cargo clippy
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/*.wasm
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Per-fixture integration tests. Each fixture under `fixtures/` is a real
  # OpenAPI spec + a `compile-test` crate that drives the *generated* code
  # through `tower::service_fn` fakes — so this catches runtime regressions
  # (wrong serde rename, shadowed status arm, untagged enum that doesn't
  # round-trip), not just "did it compile".
  #
  # Matrix design:
  #  - One job per fixture, run in parallel. New fixture? Add its directory
  #    name to the matrix list below; the steps are uniform.
  #  - `fail-fast: false` so a regression in one fixture doesn't mask the
  #    status of others.
  #  - `Plugin under test` annotates which plugins each fixture exercises —
  #    only metadata, used in the job display name. The actual coupling is
  #    declared in the fixture's `forge.toml`.
  # ---------------------------------------------------------------------------
  test-fixture:
    runs-on: ubuntu-latest
    needs: build-plugins
    name: "test ${{ matrix.fixture }} (${{ matrix.plugins }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: petstore
            plugins: "generator-rust-tower + transformer-filter-operations"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
          - fixture: json-value
            plugins: "generator-rust-tower"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
          - fixture: additional-properties-any
            plugins: "generator-rust-tower"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
          # generator-rust-clap emits a complete CLI crate (Cargo.toml +
          # src/main.rs). The generated `out/` *is* the buildable crate, so
          # the `out` row just runs `cargo build` to prove it compiles.
          - fixture: clap-petstore
            plugins: "generator-rust-clap"
            work_dir: out
            cargo_cmd: build
          # Codegen-shape regression tests for the clap generator. Lives
          # alongside the build row above so a single `forge generate
          # fixtures/clap-petstore` powers both — this row asserts the
          # *shape* (per-op handler fns, slim `main` body) while the
          # `out` row asserts the result *compiles*. Specifically pinned
          # against issue #19 (one giant inlined `async fn main` blew up
          # MIR borrow-check on medium specs).
          - fixture: clap-petstore
            plugins: "generator-rust-clap (codegen shape)"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
          # generator-html-docs emits a multi-page static HTML site.
          # The compile-test crate reads the generated files off disk
          # and asserts structural properties (semantic landmarks,
          # nested-tag DOM nesting, deprecation banner visibility,
          # markdown rendering, cross-link integrity). Zero third-party
          # deps — substring + data-* attribute assertions only,
          # matching the clap-petstore codegen-shape pattern.
          - fixture: html-petstore
            plugins: "generator-html-docs"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
          # generator-kotlin-types emits kotlinx.serialization data
          # classes + values4k value-object wrappers for an OpenAPI
          # spec, driven by `x-kotlin-source` annotations. The
          # compile-test crate asserts the generated `.kt` files match
          # the documented patterns: values4k wrapper shape, custom
          # KSerializer round-trip, explicit + inferred sealed-
          # interface discriminators, cross-package imports, snake_case
          # → @SerialName, java.time + inlined serializer.
          - fixture: kotlin-petstore
            plugins: "generator-kotlin-types"
            work_dir: compile-test
            cargo_cmd: test --no-fail-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fixtures/${{ matrix.fixture }}/${{ matrix.work_dir }} -> target"
      - name: Download wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/
      - name: Install forge CLI
        uses: MarcusDunn/openapi-forge@main
      - name: forge generate fixtures/${{ matrix.fixture }}
        run: forge generate fixtures/${{ matrix.fixture }}
      - name: cargo ${{ matrix.cargo_cmd }}
        working-directory: fixtures/${{ matrix.fixture }}/${{ matrix.work_dir }}
        run: cargo ${{ matrix.cargo_cmd }}
