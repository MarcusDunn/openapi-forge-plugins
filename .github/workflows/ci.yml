name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: rustfmt
      - name: cargo fmt (workspace root)
        run: cargo fmt --all -- --check

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build plugins (debug, wasm32-wasip2)
        run: cargo build --target wasm32-wasip2
      - name: Build plugins (release, wasm32-wasip2)
        run: cargo build --release --target wasm32-wasip2
      - name: Clippy on plugins
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/*.wasm
          retention-days: 7

  smoke-test-petstore:
    runs-on: ubuntu-latest
    needs: build-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/
      - name: Install forge CLI
        # The crate is `openapi-forge-cli` (the bare `forge-cli` name was
        # already taken on crates.io); the installed binary is still `forge`.
        run: cargo install openapi-forge-cli --version "^0.1.9" --locked
      - name: Generate petstore client
        run: forge generate fixtures/petstore
      - name: Compile generated client
        working-directory: fixtures/petstore/compile-test
        run: cargo build
