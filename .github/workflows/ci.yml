name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: rustfmt
      - name: cargo fmt (workspace root)
        run: cargo fmt --all -- --check

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build plugins (debug, wasm32-wasip2)
        run: cargo build --target wasm32-wasip2
      - name: Build plugins (release, wasm32-wasip2)
        run: cargo build --release --target wasm32-wasip2
      - name: Clippy on plugins
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/*.wasm
          retention-days: 7

  smoke-test-petstore:
    runs-on: ubuntu-latest
    needs: build-plugins
    steps:
      - uses: actions/checkout@v4
      # Latest stable — the forge CLI's transitive `wasmtime` pulls in
      # crates that need rustc ≥ 1.92. Plugin builds stay pinned to 1.87
      # in the build-plugins job above.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-plugins
          path: target/wasm32-wasip2/release/
      - name: Install forge CLI
        # The crate is `openapi-forge-cli` (the bare `forge-cli` name was
        # already taken on crates.io); the installed binary is still `forge`.
        # Override the repo's `rust-toolchain.toml` (1.87) for this step —
        # forge-cli's transitive `wasmtime` pulls in crates that need 1.92.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install openapi-forge-cli --version "^0.1.9" --locked
      - name: Generate petstore client
        run: forge generate fixtures/petstore
      - name: Test against generated client
        # `cargo test` runs the suite in `compile-test/tests/`, which
        # exercises the generated code through `tower::service_fn` fakes
        # (every codegen fix has a runtime regression test). `cargo build`
        # alone wouldn't catch e.g. an inverted serde-rename or a status
        # arm shadowed by a range arm — both compile fine.
        working-directory: fixtures/petstore/compile-test
        run: cargo test --no-fail-fast
      - name: Generate json-value client
        # The json-value fixture mirrors dialai's hand-rolled `JsonValue`
        # union (recursive `oneOf` of string/number/bool/array/object/
        # null). Exercises the `#[serde(untagged)]` enum codegen path —
        # if it regresses to a `serde_json::Value` alias or a hard
        # error, the assertion in the compile-test catches it.
        run: forge generate fixtures/json-value
      - name: Test against json-value client
        working-directory: fixtures/json-value/compile-test
        run: cargo test --no-fail-fast
