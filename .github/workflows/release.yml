name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build plugins (release, wasm32-wasip2)
        run: cargo build --release --target wasm32-wasip2
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      # Push every workspace plugin. Plugins are identified by having a
      # `cdylib` target — required for them to build as wasm components,
      # so this filter doubles as the publish gate. A future shared
      # codegen library (plain `rlib`) won't match, and won't get pushed.
      # Name + description come from each crate's Cargo.toml; the wasm
      # filename follows the cargo convention (dashes → underscores).
      #
      # `org.opencontainers.image.source` is what GHCR uses to link a
      # package to its "source repository" in the UI sidebar. Without it,
      # GHCR keeps whichever link the last annotated push set (e.g. clap
      # was still linked to the standalone repo after the move). The rest
      # are conventional: version (semver, no `v`), revision, licenses,
      # description.
      - name: Push plugins
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[]
                     | select(any(.targets[]?.crate_types[]?; . == "cdylib"))
                     | "\(.name)\t\(.description)"' \
            | while IFS=$'\t' read -r NAME DESC; do
                WASM="${NAME//-/_}.wasm"
                oras push \
                  --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                  --annotation "org.opencontainers.image.version=$VERSION" \
                  --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
                  --annotation "org.opencontainers.image.licenses=Apache-2.0 OR MIT" \
                  --annotation "org.opencontainers.image.description=$DESC" \
                  "ghcr.io/marcusdunn/$NAME:${TAG}" \
                  "target/wasm32-wasip2/release/$WASM:application/vnd.bytecodealliance.wasm.component.layer.v0+wasm"
              done
      - name: Smoke-check that the OCI artifacts are pullable
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[]
                     | select(any(.targets[]?.crate_types[]?; . == "cdylib"))
                     | .name' \
            | while read -r NAME; do
                oras manifest fetch "ghcr.io/marcusdunn/$NAME:${TAG}" > /dev/null
              done
      # Retag the freshly-pushed versioned digests as `:latest`. Done after
      # the smoke-check so `:latest` only moves when every plugin's artifact
      # is confirmed pullable — keeps `:latest` from pointing at a partial
      # release if any push step ever fails.
      - name: Retag :latest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[]
                     | select(any(.targets[]?.crate_types[]?; . == "cdylib"))
                     | .name' \
            | while read -r NAME; do
                oras tag "ghcr.io/marcusdunn/$NAME:${TAG}" latest
              done
      - name: Document follow-up
        run: |
          echo "::notice::Mark the GHCR packages as public via the repo settings UI after the first release."
