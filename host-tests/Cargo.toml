# Host-side integration tests for the generator plugins. Sits *outside*
# the root workspace (see `exclude = ["host-tests"]` in
# ../Cargo.toml) so its `forge-host` / `forge-test-harness` deps —
# which only build for the developer's host — never get pulled into the
# `cargo build --target wasm32-wasip2` that the plugin CI runs.
#
# `forge-test-harness::PluginRunner` shells out to `cargo build` to
# rebuild whichever plugin the test points at, so tests run against the
# in-tree plugin source, not a stale wasm.

[workspace]

[package]
name = "host-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Pinned to the 0.1.8 line: 0.1.9+ depends on wasmtime ^44, which
# requires rustc ≥ 1.92, but the workspace pins 1.87 to match the
# plugins' rust-toolchain.toml. The WIT contract is unchanged across
# the 0.1.8 → 0.1.9 SDK bump, so a 0.1.8 host can drive 0.1.9-built
# plugin components. Revisit once we move the toolchain forward.
forge-host = "=0.1.8"
forge-ir = "=0.1.8"
forge-test-harness = "=0.1.8"
serde_json = "1"

[dev-dependencies]
once_cell = "1"
