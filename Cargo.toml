[workspace]
resolver = "2"
members = [
    "transformer-filter-operations",
    "generator-rust-tower",
]

# Plugin crates ship as public OCI WASM components at
# `ghcr.io/marcusdunn/<plugin>:<tag>`. They build only as `cdylib` for
# `wasm32-wasip2`; tests run against the *generated* client (see the
# petstore smoke job), not against the generator's pure functions on the
# host. That keeps the bug surface aligned with what consumers actually
# see, at the cost of slower test iteration.

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/MarcusDunn/openapi-forge-plugins"

[workspace.dependencies]
forge-plugin-sdk = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
opt-level = "s"
